name: CI

on:
  push:
    branches: [mod]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
      - ".editorconfig"
  pull_request:
    branches: [mod]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
      - ".editorconfig"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.15.2

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git describe/versioning

      - name: Cache Zig compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6svg6-dev \
            libqt6serialport6-dev

      - name: Install system dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libngspice0-dev \
            libgit2-dev \
            libssl-dev \
            libboost-dev \
            libpolyclipping-dev \
            libquazip1-qt6-dev \
            libsvgpp-dev || true
          # If libsvgpp-dev is not available, download headers manually
          if ! dpkg -l libsvgpp-dev &>/dev/null; then
            git clone --depth 1 https://github.com/svgpp/svgpp.git /tmp/svgpp
            sudo mkdir -p /usr/local/include
            sudo cp -r /tmp/svgpp/include/svgpp /usr/local/include/
            echo "SVGPP_DIR=/usr/local" >> "$GITHUB_ENV"
          else
            echo "SVGPP_DIR=/usr" >> "$GITHUB_ENV"
          fi
          echo "CLIPPER_DIR=/usr" >> "$GITHUB_ENV"
          # QuaZip-Qt6 headers are either in multi-arch or single-arch dir.
          # Set QUAZIP_DIR so build.zig can discover the version subdir.
          echo "QUAZIP_DIR=/usr" >> "$GITHUB_ENV"
          # Only need a symlink for the multi-arch case (single-arch is
          # already at /usr/include/QuaZip-Qt6-1.4/).
          if [ -d /usr/include/x86_64-linux-gnu/qt6/QuaZip-Qt6-1.4 ]; then
            sudo ln -sf /usr/include/x86_64-linux-gnu/qt6/QuaZip-Qt6-1.4 /usr/include/QuaZip-Qt6-1.4
          fi

      - name: Show toolchain versions
        run: |
          zig version
          pkg-config --modversion Qt6Core 2>/dev/null || echo "Qt6Core version unknown"

      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe

      - name: Smoke test
        run: |
          ./zig-out/bin/Fritzing --version 2>&1 || true
          file ./zig-out/bin/Fritzing

  build-macos:
    name: Build (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Zig compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true

      - name: Install Qt
        run: |
          brew install qt@6
          # Do NOT set QT_DIR — let qmake -query discover real paths.
          # Just add bin to PATH so moc/uic/rcc are findable.
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Install dependencies (Homebrew)
        run: |
          brew install \
            libgit2 \
            boost \
            ngspice \
            quazip \
            qt5compat

      - name: Build polyclipping (Clipper)
        run: |
          git clone --depth 1 https://github.com/tamasmeszaros/libpolyclipping.git /tmp/polyclipping
          cd /tmp/polyclipping
          g++ -O2 -c clipper.cpp -o clipper.o
          ar rcs libpolyclipping.a clipper.o
          sudo cp libpolyclipping.a /opt/homebrew/lib/
          sudo mkdir -p /opt/homebrew/include/polyclipping
          sudo cp clipper.hpp /opt/homebrew/include/polyclipping/
          echo "CLIPPER_DIR=/opt/homebrew" >> "$GITHUB_ENV"

      - name: Install svgpp headers
        run: |
          git clone --depth 1 https://github.com/svgpp/svgpp.git /tmp/svgpp
          sudo mkdir -p /opt/homebrew/include
          sudo cp -r /tmp/svgpp/include/svgpp /opt/homebrew/include/
          sudo cp -r /tmp/svgpp/include/exboost /opt/homebrew/include/
          echo "SVGPP_DIR=/opt/homebrew" >> "$GITHUB_ENV"

      - name: Show toolchain versions
        run: |
          zig version
          pkg-config --modversion Qt6Core 2>/dev/null || echo "Qt6Core version unknown"
          if command -v qmake6 &>/dev/null; then
            echo "--- qmake6 paths ---"
            qmake6 -query QT_INSTALL_PREFIX
            qmake6 -query QT_INSTALL_HEADERS
            qmake6 -query QT_INSTALL_LIBS
            qmake6 -query QT_INSTALL_BINS
            qmake6 -query QT_INSTALL_LIBEXECS
          fi

      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe

      - name: Smoke test
        run: |
          file ./zig-out/bin/Fritzing

  build-windows:
    name: Build (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,C:\vcpkg-binary-cache,readwrite'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Zig compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: qtserialport qt5compat
          cache: true
          install-deps: false

      - name: Create vcpkg binary cache directory
        run: |
          New-Item -ItemType Directory -Path C:\vcpkg-binary-cache -Force

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
            C:\vcpkg\packages
            C:\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-20260609
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install dependencies (vcpkg)
        run: |
          vcpkg install --triplet x64-windows `
            libgit2 `
            openssl
          $vcpkg = "C:\vcpkg\installed\x64-windows"
          echo "LIBGIT2_DIR=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "OPENSSL_DIR=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          # vcpkg names OpenSSL libs libssl-3-x64.lib / libcrypto-3-x64.lib,
          # but Zig's linkSystemLibrary("ssl") looks for ssl.lib (MSVC).
          # Create standard-named copies so Zig can find them.
          if (Test-Path "$vcpkg\lib\libssl-3-x64.lib") {
            Copy-Item "$vcpkg\lib\libssl-3-x64.lib" "$vcpkg\lib\ssl.lib"
          }
          if (Test-Path "$vcpkg\lib\libcrypto-3-x64.lib") {
            Copy-Item "$vcpkg\lib\libcrypto-3-x64.lib" "$vcpkg\lib\crypto.lib"
          }

      - name: Build and install polyclipping
        run: |
          git clone --depth 1 https://github.com/tamasmeszaros/libpolyclipping.git C:\polyclipping
          cd C:\polyclipping
          cl /O2 /c clipper.cpp /Foclipper.obj
          lib clipper.obj /OUT:libpolyclipping.lib
          $vcpkg = "C:\vcpkg\installed\x64-windows"
          Copy-Item libpolyclipping.lib "$vcpkg\lib\"
          New-Item -ItemType Directory -Force -Path "$vcpkg\include\polyclipping"
          Copy-Item clipper.hpp "$vcpkg\include\polyclipping\"
          echo "CLIPPER_DIR=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Boost headers (no compilation needed)
        shell: pwsh
        run: |
          $boostVer = "1.87.0"
          $boostRoot = "C:\boost"
          $boostDir = "$boostRoot\include\boost_$($boostVer.Replace('.', '_'))"
          if (-not (Test-Path "$boostDir\boost\version.hpp")) {
            Write-Host "Downloading Boost $boostVer headers..."
            $url = "https://archives.boost.io/release/$boostVer/source/boost_$($boostVer.Replace('.', '_')).zip"
            $zip = "$env:RUNNER_TEMP\boost.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath "$boostRoot\include" -Force
            Write-Host "Boost headers extracted to $boostDir"
          }
          echo "BOOST_DIR=$boostDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Show toolchain versions
        run: |
          zig version

      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe

      - name: Smoke test
        run: |
          if (Test-Path "zig-out\bin\Fritzing.exe") {
            Write-Host "Fritzing.exe built successfully"
            Get-Item "zig-out\bin\Fritzing.exe" | Select-Object Length,FullName
          } else {
            Write-Host "Binary not found at expected path"
            Get-ChildItem -Recurse zig-out -Filter "*.exe" -ErrorAction SilentlyContinue
          }
