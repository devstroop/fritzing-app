name: CI

on:
  push:
    branches: [mod]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
      - ".editorconfig"
  pull_request:
    branches: [mod]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
      - ".editorconfig"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.15.2

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git describe/versioning

      - name: Cache Zig compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: linux
          arch: gcc_64
          modules: qtcharts qt5compat qtimageformats qtsvg qtserialport

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgit2-dev \
            libssl-dev \
            libboost-dev \
            libpolyclipping-dev \
            libquazip1-qt6-dev

      - name: Show toolchain versions
        run: zig version

      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe

      - name: Smoke test
        run: |
          ./zig-out/bin/Fritzing --version 2>&1 || true
          file ./zig-out/bin/Fritzing

  build-macos:
    name: Build (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Zig compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: mac
          arch: clang_64
          modules: qtcharts qt5compat qtimageformats qtserialport

      - name: Install dependencies (Homebrew)
        run: |
          brew install \
            libgit2 \
            boost \
            ngspice \
            quazip

      - name: Show toolchain versions
        run: zig version

      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe

      - name: Smoke test
        run: |
          file ./zig-out/bin/Fritzing

  build-windows:
    name: Build (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Zig compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: windows
          arch: win64_msvc2022_64
          modules: qtcharts qt5compat qtimageformats qtsvg qtserialport

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/.vcpkg') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install dependencies (vcpkg)
        run: |
          vcpkg install --triplet x64-windows `
            libgit2 `
            openssl `
            boost `
            polyclipping

      - name: Show toolchain versions
        run: zig version

      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe

      - name: Smoke test
        run: |
          if (Test-Path "zig-out\bin\Fritzing.exe") {
            Write-Host "Fritzing.exe built successfully"
            Get-Item "zig-out\bin\Fritzing.exe" | Select-Object Length,FullName
          } else {
            Write-Host "Binary not found at expected path"
            Get-ChildItem -Recurse zig-out -Filter "*.exe" -ErrorAction SilentlyContinue
          }
