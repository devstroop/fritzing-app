name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

env:
  ZIG_VERSION: 0.15.0

jobs:
  build-linux:
    name: Release (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig
        run: |
          curl -fsSL "https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-linux-x86_64-${{ env.ZIG_VERSION }}.tar.xz" | tar xJ
          echo "$(pwd)/zig-linux-x86_64-${{ env.ZIG_VERSION }}" >> $GITHUB_PATH

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: linux
          arch: gcc_64
          modules: qtcharts qt5compat qtimageformats qtsvg qtserialport qtconcurrent

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgit2-dev \
            libssl-dev \
            libboost-dev \
            libpolyclipping-dev \
            libquazip1-qt6-dev

      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe

      - name: Package
        run: |
          mkdir -p dist/Fritzing
          cp zig-out/bin/Fritzing dist/Fritzing/
          cp -r resources dist/Fritzing/
          cp -r sketches dist/Fritzing/
          cp README.md LICENSE.GPL3 dist/Fritzing/
          cd dist
          tar czf ../Fritzing-linux-x86_64.tar.gz Fritzing/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-linux-x86_64
          path: Fritzing-linux-x86_64.tar.gz

  build-macos:
    name: Release (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig
        run: |
          curl -fsSL "https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-macos-aarch64-${{ env.ZIG_VERSION }}.tar.xz" | tar xJ
          echo "$(pwd)/zig-macos-aarch64-${{ env.ZIG_VERSION }}" >> $GITHUB_PATH

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: mac
          arch: clang_64
          modules: qtcharts qt5compat qtimageformats qtsvg qtserialport qtconcurrent

      - name: Install dependencies (Homebrew)
        run: |
          brew install \
            libgit2 \
            boost \
            ngspice \
            quazip

      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe

      - name: Package
        run: |
          mkdir -p dist/Fritzing
          cp zig-out/bin/Fritzing dist/Fritzing/
          cp -r resources dist/Fritzing/
          cp -r sketches dist/Fritzing/
          cp README.md LICENSE.GPL3 dist/Fritzing/
          cd dist
          zip -r ../Fritzing-macos-aarch64.zip Fritzing/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-macos-aarch64
          path: Fritzing-macos-aarch64.zip

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          git log --oneline --no-decorate $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fritzing ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/Fritzing-linux-x86_64/Fritzing-linux-x86_64.tar.gz
            artifacts/Fritzing-macos-aarch64/Fritzing-macos-aarch64.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
