name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

env:
  ZIG_VERSION: 0.15.2

jobs:
  build-linux:
    name: Release (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Zig compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: true

      - name: Install Qt
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop 6.8.3 gcc_64 --outputdir ${{ runner.temp }}/Qt --modules qtsvg qtserialport
          echo "${{ runner.temp }}/Qt/6.8.3/gcc_64/bin" >> $GITHUB_PATH
          echo "QT_DIR=${{ runner.temp }}/Qt/6.8.3/gcc_64" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgit2-dev \
            libssl-dev \
            libboost-dev \
            libpolyclipping-dev \
            libquazip1-qt6-dev

      - name: Show toolchain versions
        run: zig version

      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe

      - name: Package
        run: |
          mkdir -p dist/Fritzing
          cp zig-out/bin/Fritzing dist/Fritzing/
          cp -r resources dist/Fritzing/
          cp -r sketches dist/Fritzing/
          cp README.md LICENSE.GPL3 dist/Fritzing/
          cd dist
          tar czf ../Fritzing-linux-x86_64.tar.gz Fritzing/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-linux-x86_64
          path: Fritzing-linux-x86_64.tar.gz

  build-macos:
    name: Release (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Zig compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: true

      - name: Install Qt
        run: |
          pip install aqtinstall
          aqt install-qt mac desktop 6.8.3 clang_64 --outputdir ${{ runner.temp }}/Qt --modules qtsvg qtserialport
          echo "${{ runner.temp }}/Qt/6.8.3/clang_64/bin" >> $GITHUB_PATH
          echo "QT_DIR=${{ runner.temp }}/Qt/6.8.3/clang_64" >> $GITHUB_ENV

      - name: Install dependencies (Homebrew)
        run: |
          brew install \
            libgit2 \
            boost \
            ngspice \
            quazip

      - name: Show toolchain versions
        run: zig version

      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe

      - name: Package
        run: |
          mkdir -p dist/Fritzing
          cp zig-out/bin/Fritzing dist/Fritzing/
          cp -r resources dist/Fritzing/
          cp -r sketches dist/Fritzing/
          cp README.md LICENSE.GPL3 dist/Fritzing/
          cd dist
          zip -r ../Fritzing-macos-aarch64.zip Fritzing/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-macos-aarch64
          path: Fritzing-macos-aarch64.zip

  build-windows:
    name: Release (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Zig compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: true

      - name: Install Qt
        shell: pwsh
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir ${{ runner.temp }}\Qt --modules qtsvg qtserialport
          echo "${{ runner.temp }}\Qt\6.8.3\win64_msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "QT_DIR=${{ runner.temp }}\Qt\6.8.3\win64_msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/.vcpkg') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install dependencies (vcpkg)
        run: |
          vcpkg install --triplet x64-windows `
            libgit2 `
            openssl `
            boost `
            polyclipping

      - name: Show toolchain versions
        run: zig version

      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist\Fritzing -Force
          Copy-Item zig-out\bin\Fritzing.exe dist\Fritzing\
          Copy-Item -Recurse resources dist\Fritzing\
          Copy-Item -Recurse sketches dist\Fritzing\
          Copy-Item README.md, LICENSE.GPL3 dist\Fritzing\
          Compress-Archive -Path dist\Fritzing\* -DestinationPath Fritzing-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-windows-x86_64
          path: Fritzing-windows-x86_64.zip

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          git log --oneline --no-decorate $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fritzing ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/Fritzing-linux-x86_64/Fritzing-linux-x86_64.tar.gz
            artifacts/Fritzing-macos-aarch64/Fritzing-macos-aarch64.zip
            artifacts/Fritzing-windows-x86_64/Fritzing-windows-x86_64.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
